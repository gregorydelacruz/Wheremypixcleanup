<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charter Members SignUp</title>
    <style>
        body {
            background-color: #007BFF; /* Blue background */
            color: white; /* White text for contrast */
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        #mc_embed_signup {
            background-color: #0056b3; /* Darker blue background for the signup area */
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .mc-field-group {
            margin-bottom: 15px;
        }
        input[type="email"], input[type="submit"] {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 4px;
        }
        input[type="submit"] {
            background-color: #004080; /* Even darker blue for the button */
            color: white;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #002060;
        }
        label {
            font-size: 16px;
            color: #e0e0e0;
        }
        .indicates-required {
            font-size: 12px;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div id="mc_embed_signup">
        <form action="https://gregorydelacruz.us13.list-manage.com/subscribe/post?u=dc0338a6720ee1b0490b9e2eb&amp;id=c9ba2a17ee&amp;f_id=00887ce9f0" method="post" id="mc-embedded-subscribe-form" class="validate" target="_blank">
            <div id="mc_embed_signup_scroll">
                <h2>Charter Members SignUp</h2>
                <div class="indicates-required"><span class="asterisk">*</span>required</div>
                <div class="mc-field-group">
                    <label for="mce-EMAIL">Email Address <span class="asterisk">*</span></label>
                    <input type="email" name="EMAIL" class="required email" id="mce-EMAIL" required>
                </div>
                <div id="mce-responses" class="clear">
                    <div class="response" id="mce-error-response" style="display: none;"></div>
                    <div class="response" id="mce-success-response" style="display: none;"></div>
                </div>
                <div aria-hidden="true" style="position: absolute; left: -5000px;">
                    <input type="text" name="b_dc0338a6720ee1b0490b9e2eb_c9ba2a17ee" tabindex="-1" value="">
                </div>
                <div class="clear">
                    <input type="submit" name="subscribe" id="mc-embedded-subscribe" class="button" value="Subscribe">
                </div>
            </div>
        </form>
    </div>
</body>
</html>
